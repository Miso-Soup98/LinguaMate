<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>语伴</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>语伴</h1>
        <p>YouTube / Prime Video 双语字幕学习</p>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span>启用</span>
      </label>
    </header>

    <section class="grid">
      <label>
        学习语言
        <select id="learningLang"></select>
      </label>
      <label>
        母语 / 译文
        <select id="nativeLang"></select>
      </label>
    </section>

    <section class="toggles">
      <label><input id="autoPause" type="checkbox" /> 逐句暂停</label>
      <label><input id="listenMode" type="checkbox" /> 听写模式</label>
      <label><input id="showNative" type="checkbox" /> 显示译文</label>
      <label><input id="nativeInteractive" type="checkbox" /> 译文可查词</label>
      <label><input id="highlightRare" type="checkbox" /> 高亮生僻词</label>
    </section>

    <section class="row">
      <label>
        字幕字号
        <input id="fontSize" type="range" min="16" max="40" />
      </label>
      <label>
        英语口音
        <select id="accent">
          <option value="us">美式</option>
          <option value="uk">英式</option>
        </select>
      </label>
      <label>
        播放速度
        <select id="playbackRate">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1">1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2.0x</option>
        </select>
      </label>
    </section>

    <section id="japaneseSettings" hidden>
      <label>
        日语假名注音
        <select id="japaneseFurigana">
          <option value="unknown">仅未掌握的词</option>
          <option value="all">全部显示</option>
          <option value="hover">悬停时显示</option>
          <option value="off">关闭</option>
        </select>
      </label>
    </section>

    <footer>
      <div id="stats">生词本 0</div>
      <button id="openOptions">打开生词本 / 闪卡</button>
    </footer>
    <div class="operation-feedback"><p id="operationStatus" role="status" aria-live="polite"></p><button id="retrySettings" hidden>重试</button></div>
    <script src="../shared/languages.js"></script>
    <script src="../shared/feedback.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
